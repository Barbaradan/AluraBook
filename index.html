<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alura Books</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="reset.css">
</head>
<body>
    <header class="cabecalho">
        <div class="container">
            <input type="checkbox" id="menu" class="container_btn">
            <label for="menu">
                <span class="cabecalho_menu-hamburguer container_img"></span>
            </label>
            <ul class="lista-menu">
                <li class="lista-menu-titulo">Categorias</li>
                <li class="lista-menu-item">
                    <a href="#" class="lista-menu-link">Programação</a>
                </li>
                <li class="lista-menu-item">
                    <a href="#" class="lista-menu-link">Front-End</a>
                </li>
                <li class="lista-menu-item">
                    <a href="#" class="lista-menu-link">Infraestrutura</a>
                </li>
                <li class="lista-menu-item">
                    <a href="#" class="lista-menu-link">Business</a>
                </li>
                <li class="lista-menu-item">
                    <a href="#" class="lista-menu-link">Design & UX</a>
                </li>
            </ul>
            <span class="cabecalho_menu-hamburger container_img"></span>
            <img src="images/Logo.svg" alt="Logo da AluraBooks" class="container_img">
        </div>
        <div class="container">
            <a href="#"><img src="images/Favoritos.svg" alt="Meus favoritos" class="container_img"></a>
            <a href="#"><img src="images/Compras.svg" alt="Carrinho de compras" class="container_img"></a>
            <a href="#"><img src="images/Usuario.svg" alt="Meu perfil" class="container_img"></a>
        </div>
    </header>
 
    <footer></footer>
</body>
</html>
